<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-container">
        <section class="login-card">
            <div class="brand-mark" aria-hidden="true">Hi</div>
            <p class="welcome-label">WELCOME TO WENXUAN'S PAGE</p>
            <h1>Login Page</h1>
            <p class="intro-text">Please enter your details to continue.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" autocomplete="username">
                    <small class="error-message" id="usernameError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" id="togglePassword" class="toggle-password"
                                aria-label="Show password">Show</button>
                    </div>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <div class="options-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">Login</button>
                <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
            </form>

            <p class="signup-text">Don't have an account? <a href="#" id="signUp">Sign up</a></p>
            <p class="demo-note">Demonstration page only. No real account is accessed.</p>
        </section>

        <footer>Website Design Assignment · 2026</footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
