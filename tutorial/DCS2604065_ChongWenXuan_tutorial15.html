
<!DOCTYPE html>
<html>
<head>
<title>Form - Text Input</title>

<link rel="icon" href="sunflower.jpg" type="image/jpg">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin-top: 50px;
    font-family: Verdana;
}

form {
    width: 85%;
    margin: auto;
}

caption {
    font-weight: bold;
    padding: 15px;
    color: #696969;
}

table {
    width: 100%;
    border-collapse: collapse;
}

td {
    padding: 12px;
    border: 1px solid #999;
}

td:first-child {
    background-color: #696969;
    color: white;
    width: 35%;
}

td:last-child {
    background-color: powderblue;
}

input[type="text"],
input[type="password"] {
    width: 150px;
}

textarea {
    width: 90%;
    max-width: 300px;
}

select {
    width: 150px;
}



.buttons {
    text-align: center;
}

@media screen and (max-width: 600px) {

    form {
        width: 95%;
    }

    td {
        padding: 8px;
        font-size: 12px;
    }

    input[type="text"],
    input[type="password"] {
        width: 95%;
    }

    textarea {
        width: 95%;
    }

    select {
        width: 100%;
    }

}

</style>
</head>

<body>

<form>

<table>

<caption>Personal details:</caption>

<tr>
<td>First Name:</td>
<td><input type="text" name="fname"></td>
</tr>

<tr>
<td>Last Name:</td>
<td><input type="text" name="lname"></td>
</tr>

<tr>
<td>Gender:</td>
<td>
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
</td>
</tr>

<tr>
<td>Choose your favorite subjects:</td>
<td>
<input type="checkbox" name="fav_sub" value="DCS4103">DCS4103
<input type="checkbox" name="fav_sub" value="DCS3003">DCS3003
<input type="checkbox" name="fav_sub" value="MST1003">MST1003
<input type="checkbox" name="fav_sub" value="MST2003">MST2003
</td>
</tr>

<tr>
<td>Address:</td>
<td><textarea rows="4" cols="30" name="address"></textarea></td>
</tr>

<tr>
<td>Date of birth:</td>
<td><input type="date" name="dob"></td>
</tr>

<tr>
<td>Login password:</td>
<td><input type="password" name="loginpass"></td>
</tr>

<tr>
<td>Course:</td>
<td>
<select name="course">

<option value="0">-List of Courses-</option>

<optgroup label="Diploma In Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma In Business</option>
<option value="DAS">Diploma In Airline Services</option>

</select>
</td>
</tr>
</table>

<br>
<center>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</center>

</form>

</body>
</html>
