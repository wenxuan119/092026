
<html>
<head>
<title>CSS</title>
<link rel="icon" href="sunflower.jpg" type="image/jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
h1 {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
}

p:first-of-type {
    text-align: justify;
}

font {
    text-decoration: underline;
    font-style: italic;
}

p:nth-of-type(2) {
    text-align: right;
    word-spacing: 5px;
}

p:nth-of-type(3) {
    text-indent: 30px;
    border: 2px solid black;
    margin: 20px;
    border-radius: 10px;
}
</style>

</head>
<body>

<h1>JavaScript</h1>

<p>
<font>JavaScript</font> is a scripting or programming language that allows you to implement complex features on web pages.
</p>

<p>
It works seamlessly alongside HTML and CSS.
</p>

<p>
JavaScript's widespread applications in web,
mobile app, and game development make it a valuable language to learn.
</p>

</body>
</html>
