<!DOCTYPE html>
<html>
<head>
<title>Cartoon</title>
<link rel=icon href=dog.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<script>
function bigImg(x){
	x.style.height="300px";
	x.style.width="400px";
}

function normalImg(x){
	x.style.height="150px";
	x.style.width="220px";
}
</script>
</head>
<body>

<hr size=4 color=blue width=50%>
<h1 align=center>Introduction to Disney Cartoon Characters</h1>
<hr size=4 color =blue width=50%>

<br><br>
<img onmouseover="bigImg(this)"
onmouseout="normalImg(this)"
src=sunflower.jpg height=150 width=200 border=6 align=left alt=Donald Duck>
<font color=purple size=4.<b>
SunflowerSunflowerSunflowerSunflowerSunflowerSunflower
</b></font>

<br><br><br><br><br><br><br><br><br><br>

<img onclick="bigImg(this)"
onmouseout="normalImg(this)"
src=sunflower.jpg height=150 width=200 border=6 align=left alt=Donald Duck>
<font color=purple size=4.<b>
SunflowerSunflowerSunflowerSunflowerSunflowerSunflower
</b></font>

<br><br><br><br><br><br><br><br><br><br>

<img ondblclick="bigImg(this)"
onmouseout="normalImg(this)"
src=sunflower.jpg height=150 width=200 border=6 align=left alt=Donald Duck>
<font color=purple size=4.<b>
SunflowerSunflowerSunflowerSunflowerSunflowerSunflower
</b></font>

</body></html>
